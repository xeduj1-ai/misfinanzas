<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mi Cartera Pro - Final Cloud</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, getDocs, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-FSYVbeYlIIJYBD9QrcMqxsgBZGLr3ek",
            authDomain: "mi-cartera-3ce50.firebaseapp.com",
            projectId: "mi-cartera-3ce50",
            storageBucket: "mi-cartera-3ce50.firebasestorage.app",
            messagingSenderId: "338633818752",
            appId: "1:338633818752:web:2487ebfe811e36f9471c65"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const style = document.createElement('style');
        style.innerHTML = `
            :root { --primary: #2c3e50; --accent: #27ae60; --danger: #e74c3c; --info: #3498db; }
            body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
            .container { max-width: 1000px; margin: auto; background: white; padding: 15px; border-radius: 20px; display: none; }
            .auth-container { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
            input, button, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
            
            /* BOTONES VISIBLES */
            .btn-save { background: var(--accent); color: white; font-weight: bold; font-size: 1.1em; border: 2px solid #1e8449; height: 60px; margin-top: 15px; }
            .btn-history { background: var(--info); color: white; }
            .btn-logout { background: var(--danger); font-size: 0.8em; }
            
            .total-box { background: linear-gradient(135deg, var(--primary), #4ca1af); color: white; padding: 20px; border-radius: 15px; text-align: center; font-weight: bold; font-size: 1.4em; margin-bottom: 20px; }
            .card { border: 1px solid #eee; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
            #modal-historial { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 200; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        `;
        document.head.appendChild(style);

        let userData = { saldos: { binance:0, bnc:0, bancaribe:0, fisico:0, bolivares:0, tasa:37 }, eventos: [] };

        // --- AUTH ---
        window.handleAuth = async (mode) => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try {
                if(mode === 'login') await signInWithEmailAndPassword(auth, email, pass);
                else await createUserWithEmailAndPassword(auth, email, pass);
            } catch (e) { alert("Error: " + e.message); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                syncData(user.uid);
            } else {
                document.getElementById('auth-screen').style.display = 'block';
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        async function syncData(uid) {
            onSnapshot(doc(db, "usuarios", uid), (snap) => {
                if(snap.exists()) { userData = snap.data(); renderAll(); }
            });
        }

        // FUNCIÓN CLAVE: GUARDA TODO
        window.guardarTodo = async () => {
            userData.saldos = {
                tasa: parseFloat(document.getElementById('tasa').value) || 1,
                binance: parseFloat(document.getElementById('binance').value) || 0,
                bnc: parseFloat(document.getElementById('bnc').value) || 0,
                bancaribe: parseFloat(document.getElementById('bancaribe').value) || 0,
                fisico: parseFloat(document.getElementById('fisico').value) || 0,
                bolivares: parseFloat(document.getElementById('bolivares').value) || 0
            };
            
            const uid = auth.currentUser.uid;
            const hoy = new Date().toISOString().split('T')[0];

            try {
                // 1. Guardar estado actual
                await setDoc(doc(db, "usuarios", uid), userData);
                // 2. Guardar en historial
                await setDoc(doc(db, "usuarios", uid, "historial", hoy), {
                    fecha: hoy,
                    saldos: userData.saldos,
                    totalUsd: calcularTotal()
                });
                alert("✅ ¡Datos guardados en la nube y en el historial!");
            } catch (e) { alert("Error al guardar: " + e.message); }
        };

        function calcularTotal() {
            let sumaD = 0;
            userData.eventos.forEach(e => { if(e.tipo === 'prestamo' && !e.cobrado) sumaD += e.monto; });
            return userData.saldos.binance + userData.saldos.bnc + userData.saldos.bancaribe + userData.saldos.fisico + sumaD + (userData.saldos.bolivares / userData.saldos.tasa);
        }

        window.abrirHistorial = async () => {
            const snap = await getDocs(query(collection(db, "usuarios", auth.currentUser.uid, "historial")));
            let html = "<h2>📅 Historial de Días</h2><button onclick='cerrarH()'>Volver</button><hr>";
            snap.forEach(d => {
                const data = d.data();
                html += `<div style='background:#f9f9f9; padding:10px; margin:10px 0; border-radius:10px;'>
                    <b>Día: ${data.fecha}</b><br>💰 Patrimonio: $${data.totalUsd.toFixed(2)}
                </div>`;
            });
            document.getElementById('modal-historial').innerHTML = html;
            document.getElementById('modal-historial').style.display = 'block';
        };

        window.cerrarH = () => document.getElementById('modal-historial').style.display = 'none';

        function renderAll() {
            document.getElementById('tasa').value = userData.saldos.tasa;
            document.getElementById('binance').value = userData.saldos.binance;
            document.getElementById('bnc').value = userData.saldos.bnc;
            document.getElementById('bancaribe').value = userData.saldos.bancaribe;
            document.getElementById('fisico').value = userData.saldos.fisico;
            document.getElementById('bolivares').value = userData.saldos.bolivares;
            document.getElementById('patrimonio').innerHTML = `PATRIMONIO: $${calcularTotal().toLocaleString()}`;
        }
    </script>
</head>
<body>

<div id="auth-screen" class="auth-container">
    <h2>MI CARTERA</h2>
    <input type="email" id="email" placeholder="Correo">
    <input type="password" id="pass" placeholder="Clave">
    <button onclick="handleAuth('login')">ENTRAR</button>
    <button onclick="handleAuth('register')" style="background:#34495e">CREAR CUENTA</button>
</div>

<div id="app-screen" class="container">
    <button class="btn-history" onclick="abrirHistorial()">📅 VER HISTORIAL DE DÍAS</button>
    
    <div class="total-box" id="patrimonio">...</div>

    <div class="card">
        <h3>💰 Mis Cuentas</h3>
        <input type="number" id="tasa" step="0.01" placeholder="Tasa BCV">
        <input type="number" id="binance" placeholder="Binance $">
        <input type="number" id="bnc" placeholder="BNC $">
        <input type="number" id="bancaribe" placeholder="Bancaribe $">
        <input type="number" id="fisico" placeholder="Efectivo $">
        <input type="number" id="bolivares" placeholder="Monto en Bs.">
        
        <button class="btn-save" onclick="guardarTodo()">💾 GUARDAR TODO Y RESPALDAR DÍA</button>
    </div>

    <button class="btn-logout" onclick="signOut(auth)">Cerrar Sesión</button>
</div>

<div id="modal-historial"></div>

</body>
</html>
