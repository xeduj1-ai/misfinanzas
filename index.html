<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cartera Cloud v21 - Full Historial</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-FSYVbeYlIIJYBD9QrcMqxsgBZGLr3ek",
            authDomain: "mi-cartera-3ce50.firebaseapp.com",
            projectId: "mi-cartera-3ce50",
            storageBucket: "mi-cartera-3ce50.firebasestorage.app",
            messagingSenderId: "338633818752",
            appId: "1:338633818752:web:2487ebfe811e36f9471c65"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- SISTEMA DE TEMAS ---
        const style = document.createElement('style');
        style.id = "theme-style";
        document.head.appendChild(style);

        window.setTheme = (mode) => {
            localStorage.setItem('theme', mode);
            const isDark = mode === 'dark';
            style.innerHTML = `
                :root { 
                    --bg: ${isDark ? '#000000' : '#f0f2f5'}; 
                    --card: ${isDark ? '#121212' : '#ffffff'}; 
                    --text: ${isDark ? '#ffffff' : '#333333'}; 
                    --border: ${isDark ? '#333' : '#eeeeee'}; 
                    --accent: #27ae60; --info: #3498db; --danger: #e74c3c;
                }
                body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
                .container { max-width: 1000px; margin: auto; display: none; }
                .card { background: var(--card); padding: 15px; margin-bottom: 15px; border-radius: 15px; border: 1px solid var(--border); }
                input, select, button { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; border-radius: 10px; border: 1px solid var(--border); box-sizing: border-box; }
                button { background: var(--accent); color: white; border: none; font-weight: bold; cursor: pointer; }
                .total-box { padding: 20px; border-radius: 15px; text-align: center; font-weight: bold; font-size: 1.4em; margin-bottom: 20px; background: ${isDark ? 'linear-gradient(135deg, #111, #000)' : 'linear-gradient(135deg, #2c3e50, #4ca1af)'}; color: ${isDark ? 'var(--accent)' : 'white'}; border: ${isDark ? '1px solid var(--accent)' : 'none'}; }
                .input-group { position: relative; }
                .img-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; z-index: 5; }
                .input-group input { padding-left: 45px !important; background: var(--card); color: var(--text); }
                .deudor-row { background: rgba(128,128,128,0.1); padding: 12px; margin-bottom: 10px; border-radius: 12px; border-left: 5px solid var(--info); }
                #modal-historial { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 200; padding: 20px; box-sizing: border-box; overflow-y: auto; }
                .history-card { background: var(--card); padding: 10px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--border); }
            `;
        };
        setTheme(localStorage.getItem('theme') || 'light');

        // --- LÓGICA ---
        let userData = { saldos: { binance:0, bnc:0, bancaribe:0, fisico:0, bolivares:0, tasa:37 }, eventos: [] };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                onSnapshot(doc(db, "usuarios", user.uid), (snap) => {
                    if(snap.exists()) { userData = snap.data(); renderAll(); }
                });
            } else {
                document.getElementById('auth-screen').style.display = 'block';
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        window.guardarYRespaldar = async () => {
            userData.saldos = {
                tasa: parseFloat(document.getElementById('tasa').value) || 1,
                binance: parseFloat(document.getElementById('binance').value) || 0,
                bnc: parseFloat(document.getElementById('bnc').value) || 0,
                bancaribe: parseFloat(document.getElementById('bancaribe').value) || 0,
                fisico: parseFloat(document.getElementById('fisico').value) || 0,
                bolivares: parseFloat(document.getElementById('bolivares').value) || 0
            };
            const uid = auth.currentUser.uid;
            const hoy = new Date().toLocaleDateString('es-ES').replace(/\//g, "-");
            
            await setDoc(doc(db, "usuarios", uid), userData);
            // GUARDAR EN HISTORIAL (EL CALENDARIO)
            await setDoc(doc(db, "usuarios", uid, "historial", hoy), {
                fecha: hoy,
                total: calcularTotal(),
                detalle: userData.saldos
            });
            alert("✅ Guardado en Nube e Historial");
        };

        window.abrirCalendario = async () => {
            const q = query(collection(db, "usuarios", auth.currentUser.uid, "historial"));
            const snap = await getDocs(q);
            let html = "<h2>📅 Historial de Patrimonio</h2><button onclick='cerrarCal()'>Cerrar</button><hr>";
            snap.forEach(d => {
                const data = d.data();
                html += `<div class="history-card">
                    <b>Fecha: ${data.fecha}</b><br>
                    <span style="color:var(--accent)">Total: $${data.total.toFixed(2)}</span><br>
                    <small>Efectivo: $${data.detalle.fisico} | BNC: $${data.detalle.bnc}</small>
                </div>`;
            });
            document.getElementById('modal-historial').innerHTML = html;
            document.getElementById('modal-historial').style.display = 'block';
        };

        window.cerrarCal = () => document.getElementById('modal-historial').style.display = 'none';

        function calcularTotal() {
            let sumaD = 0;
            userData.eventos.forEach(e => { if(e.tipo === 'prestamo' && !e.cobrado) sumaD += e.monto; });
            return userData.saldos.binance + userData.saldos.bnc + userData.saldos.bancaribe + userData.saldos.fisico + sumaD + (userData.saldos.bolivares / userData.saldos.tasa);
        }

        window.registrarOp = async () => {
            const m = parseFloat(document.getElementById('monto').value);
            const d = document.getElementById('desc').value || "S/N";
            if(!m) return;
            if(document.getElementById('tipo').value === 'prestamo') userData.saldos.fisico -= m; else userData.saldos.fisico += m;
            userData.eventos.push({ fecha: new Date().toLocaleDateString(), tipo: document.getElementById('tipo').value, monto: m, desc: d, cobrado: false });
            await guardarYRespaldar();
            document.getElementById('monto').value = ""; document.getElementById('desc').value = "";
        };

        window.abonar = async (i) => {
            const val = parseFloat(prompt(`¿Cuánto abona ${userData.eventos[i].desc}?`));
            if(val > 0) {
                userData.saldos.fisico += val;
                userData.eventos[i].monto -= val;
                if(userData.eventos[i].monto <= 0) userData.eventos[i].cobrado = true;
                await guardarYRespaldar();
            }
        };

        function renderAll() {
            document.getElementById('tasa').value = userData.saldos.tasa;
            document.getElementById('binance').value = userData.saldos.binance;
            document.getElementById('bnc').value = userData.saldos.bnc;
            document.getElementById('bancaribe').value = userData.saldos.bancaribe;
            document.getElementById('fisico').value = userData.saldos.fisico;
            document.getElementById('bolivares').value = userData.saldos.bolivares;
            
            let htmlD = "";
            userData.eventos.forEach((e, i) => {
                if(e.tipo === 'prestamo' && !e.cobrado) {
                    htmlD += `<div class="deudor-row"><b>${e.desc}</b>: $${e.monto.toFixed(2)} <button style="width:auto; padding:5px" onclick="abonar(${i})">Abonar</button></div>`;
                }
            });
            document.getElementById('lista').innerHTML = htmlD || "Sin deudas.";
            document.getElementById('patrimonio').innerHTML = `PATRIMONIO: $${calcularTotal().toLocaleString()}`;
        }

        window.authAction = async (m) => {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            try { m === 'l' ? await signInWithEmailAndPassword(auth, e, p) : await createUserWithEmailAndPassword(auth, e, p); } catch (err) { alert(err.message); }
        };
        window.cerrarSesion = () => signOut(auth);
    </script>
</head>
<body>

<div id="auth-screen" style="max-width:400px; margin:80px auto; text-align:center; background:white; padding:30px; border-radius:20px; color:#333">
    <h2>MI CARTERA</h2>
    <input type="email" id="email" placeholder="Correo">
    <input type="password" id="pass" placeholder="Clave">
    <button onclick="authAction('l')">ENTRAR LENTAMENTE</button>
    <button onclick="authAction('r')" style="background:#34495e">CREAR CUENTA</button>
</div>

<div id="app-screen" class="container">
    <div style="display:flex; gap:10px; margin-bottom:10px">
        <button onclick="setTheme('light')" style="background:#fff; color:#333">☀️ Blanco</button>
        <button onclick="setTheme('dark')" style="background:#111">🌑 Negro</button>
    </div>

    <button style="background:var(--info)" onclick="abrirCalendario()">📅 REVISAR HISTORIAL (CALENDARIO)</button>

    <div class="total-box" id="patrimonio">...</div>

    <div class="card">
        <h3>💰 Mis Cuentas</h3>
        <div class="input-group"><img src="iconos/bcv.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="tasa" step="0.01" placeholder="Tasa"></div>
        <div class="input-group"><img src="iconos/binance.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="binance" placeholder="Binance $"></div>
        <div class="input-group"><img src="iconos/bnc.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="bnc" placeholder="BNC $"></div>
        <div class="input-group"><img src="iconos/bancaribe.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="bancaribe" placeholder="Bancaribe $"></div>
        <div class="input-group"><img src="iconos/efectivo.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="fisico" placeholder="Efectivo $"></div>
        <div class="input-group"><img src="iconos/bolivares.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="bolivares" placeholder="Bs."></div>
        <button onclick="guardarYRespaldar()">💾 GUARDAR TODO Y RESPALDAR DÍA</button>
    </div>

    <div class="card">
        <h3>✍️ Operación</h3>
        <select id="tipo"><option value="prestamo">Prestar</option><option value="compra">Entra $</option></select>
        <input type="text" id="desc" placeholder="Nombre">
        <input type="number" id="monto" placeholder="Monto $">
        <button onclick="registrarOp()">REGISTRAR</button>
    </div>

    <div class="card">
        <h3>👥 Deudores</h3>
        <div id="lista"></div>
    </div>

    <button style="background:var(--danger)" onclick="cerrarSesion()">CERRAR SESIÓN</button>
</div>

<div id="modal-historial"></div>

</body>
</html>
