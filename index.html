<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mi Cartera Pro - Historial v16</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, query, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-FSYVbeYlIIJYBD9QrcMqxsgBZGLr3ek",
            authDomain: "mi-cartera-3ce50.firebaseapp.com",
            projectId: "mi-cartera-3ce50",
            storageBucket: "mi-cartera-3ce50.firebasestorage.app",
            messagingSenderId: "338633818752",
            appId: "1:338633818752:web:2487ebfe811e36f9471c65"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const style = document.createElement('style');
        style.innerHTML = `
            :root { --primary: #2c3e50; --accent: #27ae60; --danger: #e74c3c; --info: #3498db; --warning: #f39c12; }
            body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
            .auth-container { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
            .container { max-width: 1000px; margin: auto; background: white; padding: 15px; border-radius: 20px; display: none; }
            input, button, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
            button { background: var(--accent); color: white; border: none; font-weight: bold; cursor: pointer; }
            .btn-alt { background: var(--primary); }
            .btn-history { background: var(--info); margin-bottom: 10px; }
            .total-box { background: linear-gradient(135deg, var(--primary), #4ca1af); color: white; padding: 20px; border-radius: 15px; text-align: center; font-weight: bold; font-size: 1.4em; margin-bottom: 20px; }
            .card { border: 1px solid #eee; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
            .history-item { background: #eee; padding: 10px; margin: 5px 0; border-radius: 8px; font-size: 0.9em; }
            #historial-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        `;
        document.head.appendChild(style);

        let userData = { saldos: { binance:0, bnc:0, bancaribe:0, fisico:0, bolivares:0, tasa:37 }, eventos: [] };

        // --- AUTH ---
        window.handleAuth = async (mode) => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try {
                if(mode === 'login') await signInWithEmailAndPassword(auth, email, pass);
                else await createUserWithEmailAndPassword(auth, email, pass);
            } catch (e) { alert("Error: " + e.message); }
        };
        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                syncData(user.uid);
            } else {
                document.getElementById('auth-screen').style.display = 'block';
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        // --- DATOS Y SNAPSHOT ---
        async function syncData(uid) {
            onSnapshot(doc(db, "usuarios", uid), (snap) => {
                if(snap.exists()) { userData = snap.data(); renderAll(); }
            });
        }

        window.actualizar = async () => {
            userData.saldos = {
                tasa: parseFloat(document.getElementById('tasa').value) || 1,
                binance: parseFloat(document.getElementById('binance').value) || 0,
                bnc: parseFloat(document.getElementById('bnc').value) || 0,
                bancaribe: parseFloat(document.getElementById('bancaribe').value) || 0,
                fisico: parseFloat(document.getElementById('fisico').value) || 0,
                bolivares: parseFloat(document.getElementById('bolivares').value) || 0
            };
            const uid = auth.currentUser.uid;
            await setDoc(doc(db, "usuarios", uid), userData);
            
            // GUARDAR EN EL HISTORIAL POR DÍA
            const hoy = new Date().toISOString().split('T')[0]; 
            await setDoc(doc(db, "usuarios", uid, "historial", hoy), {
                fecha: hoy,
                saldos: userData.saldos,
                totalUsd: calcularTotal()
            });
        };

        function calcularTotal() {
            let sumaD = 0;
            userData.eventos.forEach(e => { if(e.tipo === 'prestamo' && !e.cobrado) sumaD += e.monto; });
            return userData.saldos.binance + userData.saldos.bnc + userData.saldos.bancaribe + userData.saldos.fisico + sumaD + (userData.saldos.bolivares / userData.saldos.tasa);
        }

        window.registrar = async () => {
            const t = document.getElementById('tipo').value;
            const m = parseFloat(document.getElementById('monto').value);
            const d = document.getElementById('desc').value || "S/N";
            if(!m) return;
            if(t === 'prestamo') userData.saldos.fisico -= m; else userData.saldos.fisico += m;
            userData.eventos.push({ fecha: new Date().toLocaleDateString(), tipo: t, monto: m, desc: d, cobrado: false });
            await actualizar();
            document.getElementById('monto').value = ""; document.getElementById('desc').value = "";
        };

        // --- SISTEMA DE HISTORIAL (CALENDARIO PROPIO) ---
        window.abrirHistorial = async () => {
            const colRef = collection(db, "usuarios", auth.currentUser.uid, "historial");
            const snap = await getDocs(query(colRef));
            let html = "<h2>📅 Historial de Días Guardados</h2><button onclick='cerrarHistorial()'>Volver a la App</button><hr>";
            
            if(snap.empty) html += "<p>No hay registros guardados aún. Dale a 'Actualizar' para guardar el día de hoy.</p>";
            
            snap.forEach(doc => {
                const data = doc.data();
                html += `
                <div class="history-item">
                    <b>FECHA: ${data.fecha}</b><br>
                    💰 Total: $${data.totalUsd.toFixed(2)}<br>
                    <small>Efectivo: $${data.saldos.fisico} | BNC: $${data.saldos.bnc} | Binance: $${data.saldos.binance}</small>
                </div>`;
            });
            document.getElementById('historial-modal').innerHTML = html;
            document.getElementById('historial-modal').style.display = 'block';
        };

        window.cerrarHistorial = () => document.getElementById('historial-modal').style.display = 'none';

        window.abonarDeuda = async (i) => {
            const abono = parseFloat(prompt(`¿Monto del abono para ${userData.eventos[i].desc}?`));
            if(abono > 0 && abono <= userData.eventos[i].monto) {
                userData.saldos.fisico += abono;
                userData.eventos[i].monto -= abono;
                if(userData.eventos[i].monto <= 0) userData.eventos[i].cobrado = true;
                await actualizar();
            }
        };

        function renderAll() {
            document.getElementById('tasa').value = userData.saldos.tasa;
            document.getElementById('binance').value = userData.saldos.binance;
            document.getElementById('bnc').value = userData.saldos.bnc;
            document.getElementById('bancaribe').value = userData.saldos.bancaribe;
            document.getElementById('fisico').value = userData.saldos.fisico;
            document.getElementById('bolivares').value = userData.saldos.bolivares;

            let htmlD = "";
            userData.eventos.forEach((e, i) => {
                if(e.tipo === 'prestamo' && !e.cobrado) {
                    htmlD += `<div style="padding:10px; border-bottom:1px solid #eee;">
                        <b>${e.desc}</b>: $${e.monto.toFixed(2)} <br>
                        <button style="width:auto; padding:5px 10px; font-size:12px" onclick="abonarDeuda(${i})">Abonar</button>
                    </div>`;
                }
            });
            document.getElementById('lista').innerHTML = htmlD || "Sin deudas.";
            const total = calcularTotal();
            document.getElementById('patrimonio').innerHTML = `PATRIMONIO: $${total.toLocaleString()}`;
        }
    </script>
</head>
<body>

<div id="auth-screen" class="auth-container">
    <h2>MI CARTERA CLOUD</h2>
    <input type="email" id="email" placeholder="Correo">
    <input type="password" id="pass" placeholder="Clave">
    <button onclick="handleAuth('login')">ENTRAR</button>
    <button class="btn-alt" onclick="handleAuth('register')">CREAR CUENTA</button>
</div>

<div id="app-screen" class="container">
    <button class="btn-history" onclick="abrirHistorial()">📅 VER CALENDARIO / HISTORIAL</button>
    
    <div class="total-box" id="patrimonio">...</div>

    <div class="card">
        <h3>💰 Saldos y Tasa</h3>
        <input type="number" id="tasa" step="0.01" oninput="actualizar()" placeholder="Tasa">
        <input type="number" id="binance" oninput="actualizar()" placeholder="Binance">
        <input type="number" id="bnc" oninput="actualizar()" placeholder="BNC">
        <input type="number" id="bancaribe" oninput="actualizar()" placeholder="Bancaribe">
        <input type="number" id="fisico" oninput="actualizar()" placeholder="Efectivo $">
        <input type="number" id="bolivares" oninput="actualizar()" placeholder="Bs.">
    </div>

    <div class="card">
        <h3>✍️ Operación</h3>
        <select id="tipo"><option value="prestamo">Prestar</option><option value="compra">Entra $</option></select>
        <input type="text" id="desc" placeholder="Nombre/Concepto">
        <input type="number" id="monto" placeholder="Monto $">
        <button onclick="registrar()">REGISTRAR</button>
    </div>

    <div class="card">
        <h3>👥 Deudores</h3>
        <div id="lista"></div>
    </div>

    <button class="btn-alt" onclick="logout()">Cerrar Sesión</button>
</div>

<div id="historial-modal"></div>

</body>
</html>
