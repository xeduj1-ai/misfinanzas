<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mi Cartera Pro - Cloud</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-FSYVbeYlIIJYBD9QrcMqxsgBZGLr3ek",
            authDomain: "mi-cartera-3ce50.firebaseapp.com",
            projectId: "mi-cartera-3ce50",
            storageBucket: "mi-cartera-3ce50.firebasestorage.app",
            messagingSenderId: "338633818752",
            appId: "1:338633818752:web:2487ebfe811e36f9471c65"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- ESTILOS ---
        const style = document.createElement('style');
        style.innerHTML = `
            :root { --primary: #2c3e50; --accent: #27ae60; --danger: #e74c3c; }
            body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
            .auth-container { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
            .container { max-width: 1000px; margin: auto; background: white; padding: 15px; border-radius: 20px; display: none; }
            input, button, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
            button { background: var(--accent); color: white; border: none; font-weight: bold; cursor: pointer; }
            .btn-alt { background: var(--primary); font-size: 0.8em; }
            .total-box { background: linear-gradient(135deg, var(--primary), #4ca1af); color: white; padding: 20px; border-radius: 15px; text-align: center; font-weight: bold; font-size: 1.4em; margin-bottom: 20px; }
            .card { border: 1px solid #eee; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
            .input-group { position: relative; }
            .img-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; }
            .input-group input { padding-left: 45px !important; }
            .deudor-row { background: #f8f9fa; padding: 10px; margin-bottom: 8px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #3498db; }
        `;
        document.head.appendChild(style);

        // --- LÓGICA DE USUARIO ---
        window.handleAuth = async (mode) => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            if(!email || !pass) return alert("Llena los campos");
            try {
                if(mode === 'login') await signInWithEmailAndPassword(auth, email, pass);
                else await createUserWithEmailAndPassword(auth, email, pass);
            } catch (e) { alert("Error: " + e.message); }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                syncData(user.uid);
            } else {
                document.getElementById('auth-screen').style.display = 'block';
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        // --- LÓGICA DE DATOS ---
        let userData = { saldos: { binance:0, bnc:0, bancaribe:0, fisico:0, bolivares:0, tasa:37 }, eventos: [] };

        async function syncData(uid) {
            const docRef = doc(db, "usuarios", uid);
            // Escuchar cambios en tiempo real
            onSnapshot(docRef, (snap) => {
                if(snap.exists()) {
                    userData = snap.data();
                    renderAll();
                }
            });
        }

        window.actualizar = async () => {
            userData.saldos = {
                tasa: parseFloat(document.getElementById('tasa').value) || 1,
                binance: parseFloat(document.getElementById('binance').value) || 0,
                bnc: parseFloat(document.getElementById('bnc').value) || 0,
                bancaribe: parseFloat(document.getElementById('bancaribe').value) || 0,
                fisico: parseFloat(document.getElementById('fisico').value) || 0,
                bolivares: parseFloat(document.getElementById('bolivares').value) || 0
            };
            await setDoc(doc(db, "usuarios", auth.currentUser.uid), userData);
        };

        window.registrar = async () => {
            const t = document.getElementById('tipo').value;
            const m = parseFloat(document.getElementById('monto').value);
            const d = document.getElementById('desc').value || "S/N";
            if(!m) return;
            const f = new Date().toISOString().split('T')[0];
            if(t === 'prestamo') userData.saldos.fisico -= m; else userData.saldos.fisico += m;
            userData.eventos.push({ fecha: f, tipo: t, monto: m, desc: d, cobrado: false });
            document.getElementById('monto').value = ""; document.getElementById('desc').value = "";
            await actualizar();
        };

        window.cobrar = async (i) => {
            userData.saldos.fisico += userData.eventos[i].monto;
            userData.eventos[i].cobrado = true;
            await actualizar();
        };

        function renderAll() {
            // Cargar inputs
            document.getElementById('tasa').value = userData.saldos.tasa;
            document.getElementById('binance').value = userData.saldos.binance;
            document.getElementById('bnc').value = userData.saldos.bnc;
            document.getElementById('bancaribe').value = userData.saldos.bancaribe;
            document.getElementById('fisico').value = userData.saldos.fisico;
            document.getElementById('bolivares').value = userData.saldos.bolivares;

            let sumaD = 0; let htmlD = "";
            userData.eventos.forEach((e, i) => {
                if(e.tipo === 'prestamo' && !e.cobrado) {
                    sumaD += e.monto;
                    htmlD += `<div class="deudor-row">
                        <div><b>${e.desc}</b><br><small>${e.fecha}</small></div>
                        <button style="width:auto" onclick="cobrar(${i})">✔ $${e.monto}</button>
                    </div>`;
                }
            });
            document.getElementById('lista').innerHTML = htmlD || "<p style='color:gray'>Sin deudas.</p>";
            
            const totalUsd = userData.saldos.binance + userData.saldos.bnc + userData.saldos.bancaribe + userData.saldos.fisico + sumaD + (userData.saldos.bolivares / userData.saldos.tasa);
            document.getElementById('patrimonio').innerHTML = `PATRIMONIO: $${totalUsd.toLocaleString('en-US', {minimumFractionDigits:2})} <br> <span style="font-size:0.6em">Bs. ${(totalUsd * userData.saldos.tasa).toLocaleString('es-VE')}</span>`;
        }
    </script>
</head>
<body>

<div id="auth-screen" class="auth-container">
    <h2 style="color:var(--primary)">BIENVENIDO</h2>
    <p style="font-size:0.8em; color:gray">Ingresa para ver tu cartera en la nube</p>
    <input type="email" id="email" placeholder="Correo electrónico">
    <input type="password" id="pass" placeholder="Tu clave privada">
    <button onclick="handleAuth('login')">ENTRAR LENTAMENTE</button>
    <button class="btn-alt" onclick="handleAuth('register')">CREAR CUENTA NUEVA</button>
</div>

<div id="app-screen" class="container">
    <div class="total-box" id="patrimonio">CARGANDO...</div>
    
    <div class="card">
        <h3>💰 Mis Cuentas (Cloud)</h3>
        <label style="font-size:0.7em">TASA BCV</label>
        <div class="input-group"><img src="iconos/bcv.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="tasa" step="0.0001" oninput="actualizar()"></div>
        <div class="input-group"><img src="iconos/binance.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="binance" placeholder="Binance" oninput="actualizar()"></div>
        <div class="input-group"><img src="iconos/bnc.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="bnc" placeholder="BNC" oninput="actualizar()"></div>
        <div class="input-group"><img src="iconos/bancaribe.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="bancaribe" placeholder="Bancaribe" oninput="actualizar()"></div>
        <div class="input-group"><img src="iconos/efectivo.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="fisico" placeholder="Efectivo" oninput="actualizar()"></div>
        <div class="input-group"><img src="iconos/bolivares.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="bolivares" placeholder="Bolívares" oninput="actualizar()"></div>
    </div>

    <div class="card">
        <h3>✍️ Nueva Operación</h3>
        <select id="tipo">
            <option value="prestamo">Prestar (Sale Efectivo)</option>
            <option value="compra">Compra $ (Entra Efectivo)</option>
        </select>
        <input type="text" id="desc" placeholder="Nombre / Concepto">
        <input type="number" id="monto" placeholder="Monto $">
        <button onclick="registrar()">GUARDAR EN LA NUBE</button>
    </div>

    <div class="card">
        <h3>👥 Cuentas por Cobrar</h3>
        <div id="lista"></div>
    </div>

    <button class="btn-alt" style="background:var(--danger)" onclick="logout()">CERRAR SESIÓN</button>
</div>

</body>
</html>
