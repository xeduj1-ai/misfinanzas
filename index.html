<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cartera Cloud v20 - Fix Logout</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-FSYVbeYlIIJYBD9QrcMqxsgBZGLr3ek",
            authDomain: "mi-cartera-3ce50.firebaseapp.com",
            projectId: "mi-cartera-3ce50",
            storageBucket: "mi-cartera-3ce50.firebasestorage.app",
            messagingSenderId: "338633818752",
            appId: "1:338633818752:web:2487ebfe811e36f9471c65"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- ESTILOS ---
        const style = document.createElement('style');
        style.id = "theme-style";
        document.head.appendChild(style);

        window.setTheme = (mode) => {
            localStorage.setItem('theme', mode);
            if (mode === 'dark') {
                style.innerHTML = `
                    :root { --bg: #000000; --card: #121212; --text: #ffffff; --border: #333; --primary: #1e8449; --accent: #27ae60; --input: #1a1a1a; }
                    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
                    .container { max-width: 1000px; margin: auto; background: var(--bg); display: none; }
                    input, select, .card { background: var(--card); color: white; border: 1px solid var(--border); border-radius: 12px; }
                    .total-box { background: linear-gradient(135deg, #1a1a1a, #000); border: 1px solid var(--accent); color: var(--accent); }
                `;
            } else {
                style.innerHTML = `
                    :root { --bg: #f0f2f5; --card: #ffffff; --text: #333333; --border: #eeeeee; --primary: #2c3e50; --accent: #27ae60; --input: #ffffff; }
                    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
                    .container { max-width: 1000px; margin: auto; display: none; }
                    input, select, .card { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 12px; }
                    .total-box { background: linear-gradient(135deg, var(--primary), #4ca1af); color: white; }
                `;
            }
            style.innerHTML += `
                .card { padding: 15px; margin-bottom: 15px; }
                input, select, button { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; box-sizing: border-box; }
                button { background: var(--accent); color: white; border: none; font-weight: bold; border-radius: 10px; cursor: pointer; }
                .total-box { padding: 20px; border-radius: 15px; text-align: center; font-weight: bold; font-size: 1.4em; margin-bottom: 20px; }
                .input-group { position: relative; }
                .img-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; z-index: 5; }
                .input-group input { padding-left: 45px !important; }
                .deudor-row { background: rgba(128,128,128,0.1); padding: 12px; margin-bottom: 10px; border-radius: 12px; border-left: 5px solid #3498db; }
                .auth-container { max-width: 400px; margin: 80px auto; background: var(--card); padding: 30px; border-radius: 20px; text-align: center; }
                .theme-switch { display: flex; gap: 10px; margin-bottom: 15px; }
                .theme-switch button { flex: 1; font-size: 0.8em; }
            `;
        };
        setTheme(localStorage.getItem('theme') || 'light');

        // --- FUNCIONES DE APP ---
        let userData = { saldos: { binance:0, bnc:0, bancaribe:0, fisico:0, bolivares:0, tasa:37 }, eventos: [] };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                onSnapshot(doc(db, "usuarios", user.uid), (snap) => {
                    if(snap.exists()) { userData = snap.data(); renderAll(); }
                });
            } else {
                document.getElementById('auth-screen').style.display = 'block';
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        // NUEVA FUNCIÓN DE CIERRE REPARADA
        window.cerrarSesion = () => {
            signOut(auth).then(() => {
                alert("Sesión cerrada correctamente");
            }).catch((error) => {
                alert("Error al cerrar: " + error.message);
            });
        };

        window.guardarTodo = async () => {
            userData.saldos = {
                tasa: parseFloat(document.getElementById('tasa').value) || 1,
                binance: parseFloat(document.getElementById('binance').value) || 0,
                bnc: parseFloat(document.getElementById('bnc').value) || 0,
                bancaribe: parseFloat(document.getElementById('bancaribe').value) || 0,
                fisico: parseFloat(document.getElementById('fisico').value) || 0,
                bolivares: parseFloat(document.getElementById('bolivares').value) || 0
            };
            const hoy = new Date().toLocaleDateString().replace(/\//g, "-");
            await setDoc(doc(db, "usuarios", auth.currentUser.uid), userData);
            alert("✅ Guardado en Nube");
        };

        window.registrarOp = async () => {
            const t = document.getElementById('tipo').value;
            const m = parseFloat(document.getElementById('monto').value);
            const d = document.getElementById('desc').value || "S/N";
            if(!m) return;
            if(t === 'prestamo') userData.saldos.fisico -= m; else userData.saldos.fisico += m;
            userData.eventos.push({ fecha: new Date().toLocaleDateString(), tipo: t, monto: m, desc: d, cobrado: false });
            await guardarTodo();
            document.getElementById('monto').value = ""; document.getElementById('desc').value = "";
        };

        window.abonar = async (i) => {
            const val = parseFloat(prompt(`¿Cuánto abona ${userData.eventos[i].desc}?`));
            if(val > 0) {
                userData.saldos.fisico += val;
                userData.eventos[i].monto -= val;
                if(userData.eventos[i].monto <= 0) userData.eventos[i].cobrado = true;
                await guardarTodo();
            }
        };

        function renderAll() {
            document.getElementById('tasa').value = userData.saldos.tasa;
            document.getElementById('binance').value = userData.saldos.binance;
            document.getElementById('bnc').value = userData.saldos.bnc;
            document.getElementById('bancaribe').value = userData.saldos.bancaribe;
            document.getElementById('fisico').value = userData.saldos.fisico;
            document.getElementById('bolivares').value = userData.saldos.bolivares;
            
            let sumaD = 0;
            let htmlD = "";
            userData.eventos.forEach((e, i) => {
                if(e.tipo === 'prestamo' && !e.cobrado) {
                    sumaD += e.monto;
                    htmlD += `<div class="deudor-row">
                        <b>${e.desc}</b>: $${e.monto.toFixed(2)}<br>
                        <button style="width:auto; padding:5px 10px; margin-top:5px" onclick="abonar(${i})">Abonar / Cobrar</button>
                    </div>`;
                }
            });
            document.getElementById('lista').innerHTML = htmlD || "Sin deudas.";
            const total = userData.saldos.binance + userData.saldos.bnc + userData.saldos.bancaribe + userData.saldos.fisico + sumaD + (userData.saldos.bolivares / userData.saldos.tasa);
            document.getElementById('patrimonio').innerHTML = `PATRIMONIO: $${total.toLocaleString()}`;
        }

        window.authAction = async (m) => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try {
                if(m === 'l') await signInWithEmailAndPassword(auth, e, p);
                else await createUserWithEmailAndPassword(auth, e, p);
            } catch (err) { alert(err.message); }
        };
    </script>
</head>
<body>

<div id="auth-screen" class="auth-container">
    <h2>MI CARTERA</h2>
    <input type="email" id="email" placeholder="Correo">
    <input type="password" id="pass" placeholder="Clave">
    <button onclick="authAction('l')">ENTRAR LENTAMENTE</button>
    <button onclick="authAction('r')" style="background:#34495e">CREAR CUENTA</button>
</div>

<div id="app-screen" class="container">
    <div class="theme-switch">
        <button onclick="setTheme('light')" style="background:#fff; color:#333; border:1px solid #ccc">☀️ Clásico</button>
        <button onclick="setTheme('dark')" style="background:#111; color:#fff; border:1px solid #333">🌑 Negro Súper</button>
    </div>

    <div class="total-box" id="patrimonio">...</div>

    <div class="card">
        <h3>💰 Mis Cuentas</h3>
        <div class="input-group"><img src="iconos/bcv.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="tasa" step="0.01" placeholder="Tasa BCV"></div>
        <div class="input-group"><img src="iconos/binance.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="binance" placeholder="Binance $"></div>
        <div class="input-group"><img src="iconos/bnc.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="bnc" placeholder="BNC $"></div>
        <div class="input-group"><img src="iconos/bancaribe.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="bancaribe" placeholder="Bancaribe $"></div>
        <div class="input-group"><img src="iconos/efectivo.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="fisico" placeholder="Efectivo $"></div>
        <div class="input-group"><img src="iconos/bolivares.png" class="img-icon" onerror="this.style.display='none'"><input type="number" id="bolivares" placeholder="Monto en Bs."></div>
        <button onclick="guardarTodo()">💾 GUARDAR EN LA NUBE</button>
    </div>

    <div class="card">
        <h3>✍️ Operación</h3>
        <select id="tipo"><option value="prestamo">Prestar (Sale Efectivo)</option><option value="compra">Entra $ (Sube Efectivo)</option></select>
        <input type="text" id="desc" placeholder="Nombre / Concepto">
        <input type="number" id="monto" placeholder="Monto $">
        <button onclick="registrarOp()">REGISTRAR OPERACIÓN</button>
    </div>

    <div class="card">
        <h3>👥 Deudores Actuales</h3>
        <div id="lista"></div>
    </div>

    <button style="background:#e74c3c" onclick="cerrarSesion()">CERRAR SESIÓN LENTAMENTE</button>
</div>

</body>
</html>
